<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos - SIGECAP</title>
    <link rel="stylesheet" href="assets/css/treasury.css"> 
    <link rel="stylesheet" href="assets/css/events.css">
    <!-- FullCalendar CSS (obrigatório) - sem isso o calendário não será visível mesmo com o JS carregado -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/main.min.css">
    <!-- Fonte Poppins usada globalmente para consistência visual -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/icons/favicon.ico">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js'></script>
</head>
<body>
    <div class="container">
        <nav class="sidebar collapsed">
            <header class="sidebar-header">
                <img src="assets/icons/favicon-96x96.png" alt="Logo" class="logo">
                <div class="header-text">
                    <span class="chapter-name">Liberdade Harmoniosa</span>
                    <span class="chapter-number">Capítulo n° 387</span>
                </div>
            </header>
            <button id="toggle-btn" class="toggle-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15.5 19L8.5 12L15.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <ul class="menu-items">
                 <li><a href="hub-page.html"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Dashboard</span></a></li>
                 
                <li><a href="events.html" class="active"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><span>Eventos</span></a></li>

                <li><a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span>Membros</span></a></li>
                <li><a href="treasury.html"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg><span>Tesouraria</span></a></li>

                <li><a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg><span>Configurações</span></a></li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="main-header">
                <h1>Eventos</h1>
                <!-- Botão abre modal com calendário navegável para criar/gerenciar eventos -->
                <button id="manage-events-btn" class="manage-btn">Gerenciar Eventos</button>
                <div class="user-profile">
                    <span>User</span>
                </div>
            </header>

            <div class="calendar-wrapper">
                <div id="calendar"></div>
            </div>
        </main>
    </div>

    <!-- Modal de confirmação de presença: texto e botões Confirmar/Cancelar -->
    <div class="modal-overlay" id="confirm-presence-modal">
        <div class="modal-content small-modal">
            <header class="modal-header">
                <h2 id="confirm-event-title"></h2>
                <button class="close-modal-btn" data-target="confirm-presence-modal">&times;</button>
            </header>
            <p class="confirm-text">Deseja confirmar sua presença neste evento?</p>
            <div class="confirm-buttons">
                <button class="cancel-btn">Cancelar</button>
                <button class="submit-btn confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="mark-event-modal">
        <div class="modal-content">
            <header class="modal-header">
                <h2>Marcar Novo Evento</h2>
                <button class="close-modal-btn" data-target="mark-event-modal">&times;</button>
            </header>
            <form class="modal-form">
                <div class="form-group">
                    <label for="event-name">Nome do Evento</label>
                    <input type="text" id="event-name" required>
                </div>
                 <div class="form-group">
                    <label for="event-time">Horário de Início</label>
                    <input type="time" id="event-time" required>
                </div>
                <div class="form-group">
                    <label for="event-description">Descrição</label>
                    <textarea id="event-description" rows="4"></textarea>
                </div>
                <input type="hidden" id="event-date">
                <button type="submit" class="submit-btn">Marcar</button>
            </form>
        </div>
    </div>

    <!-- Modal para Gerenciar Eventos (calendário navegável)
        Observações:
        - Este modal inicializa um segundo FullCalendar menor quando aberto.
        - O calendário de gerenciamento usa `dateClick` para abrir o formulário de marcação.
        - Eventos criados aqui são adicionados somente no cliente (sem persistência).
    -->
    
    <div class="modal-overlay" id="manage-events-modal">
    <div class="modal-overlay" id="manage-events-modal">
        <div class="modal-content manage-modal">
            <header class="modal-header">
                <h2>Gerenciar Eventos</h2>
                <button class="close-modal-btn" data-target="manage-events-modal">&times;</button>
            </header>
            <div id="manage-calendar" style="width:100%;"></div>
        </div>
    </div>
    
    <script src="https://kit.fontawesome.com/8c5f917d47.js" crossorigin="anonymous"></script>
    <script src="assets/js/hub.js"></script>
    <script src="assets/js/events.js"></script>
</body>
</html>
