<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CLH n° 387</title>

    <link rel="stylesheet" href="assets/css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-96x96.png">
    <link rel="manifest" href="assets/icons/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">

</head>

<body>

    <main class="login-container">
        <img src="assets/images/DeMoaly-coat-of-arms.png" alt="Brasão do Capítulo" class="logo-img">

        <h1 class="login-title">Sistema Integrado</h1>
        <p class="login-subtitle">Capítulo Liberdade Harmoniosa n° 387</p>

        <form>
            <section class="input-group">
                <label for="email">Usuário ou E-mail</label>
                <input type="email" id="email" name="email" required>
            </section>

            <section class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </section>

                <button type="submit" class="login-button">Entrar</button>
           
            <nav class="forgot-password">
                <a href="#">Esqueceu sua senha?</a>
            </nav>
        </form>

    </main>

</body>

</html>
