<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Integrado - Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="login-card">
        <img src="assets/images/DeMoaly-coat-of-arms.png" alt="Logo Capítulo" class="logo img-fluid mx-auto d-block mb-3">

        <h2 class="text-center text-primary-color mb-1">
            Sistema Integrado
        </h2>
        <p class="text-center text-secondary-color mb-4">
            Capítulo Liberdade Harmoniosa nº 387
        </p>

        <form>
            <div class="mb-3">
                <label for="email" class="form-label">Usuário ou E-mail</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            
            <button type="submit" class="btn btn-accent w-100 mt-3">
                ENTRAR
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="#" class="forgot-password-link">Esqueceu sua senha?</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
